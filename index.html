<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartor Hancock</title>
  <meta name="description" content="Cartor Hancock's personal site.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%233b6ef5'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>C</text></svg>">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5c6670;
      --border: #e2e6ea;
      --accent: #3b6ef5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e8eaed;
        --muted: #9aa3ad;
        --border: #262b34;
        --accent: #7c9cff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { width: 100%; max-width: 440px; text-align: center; }
    .avatar {
      width: 96px; height: 96px; margin: 0 auto 20px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: var(--accent); color: #fff;
      font-size: 40px; font-weight: 600;
      object-fit: cover;
    }
    h1 { margin: 0 0 32px; font-size: 28px; letter-spacing: -0.01em; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.link {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: border-color .15s, transform .15s;
    }
    a.link:hover, a.link:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
    a.link svg { width: 18px; height: 18px; flex: none; fill: currentColor; }
    footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>

         <img class="avatar" src="photo.jpg" alt="Cartor Hancock"> -->
